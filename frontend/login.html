<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Login</title>

    <link rel="stylesheet" href="/css/login.css">

</head>

<body>

<div class="login-container">

    <h1>Smart QR Attendance</h1>

    <h2>Student Login</h2>

    <form id="loginForm">

        <input
            type="email"
            id="email"
            placeholder="Email"
            required
        >

        <input
            type="password"
            id="password"
            placeholder="Password"
            required
        >

        <button type="submit">
            Login
        </button>

    </form>

    <p id="message"></p>

    <p>
        Don't have an account?
        <a href="register">
            Register
        </a>
    </p>

</div>

<script src="/js/login.js"></script>

</body>
</html>
