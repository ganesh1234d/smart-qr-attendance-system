<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Attendance</title>

    <link rel="stylesheet" href="../css/attendance.css">

</head>

<body>

    <div class="container">

        <h1>SMART QR ATTENDANCE</h1>

        <h2 id="welcome">Welcome</h2>

        <div class="attendance-card">

            <h3>Today's Attendance</h3>

            <p id="attendanceStatus">
                Status : Not Marked ❌
            </p>

        </div>

        <button id="swipeBtn">

            Swipe To Mark Attendance →

        </button>

        <div class="note">

            <h3>NOTE</h3>

            <ul>

                <li>Attendance can be marked only once.</li>

                <li>You must be inside the institute campus.</li>

                <li>GPS verification is mandatory.</li>

            </ul>

        </div>

    </div>

    <script src="../js/attendance.js"></script>

</body>

</html>
