<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Student Dashboard</title>

<link rel="stylesheet" href="../css/dashboard.css">

</head>

<body>

<div class="header">

    <h1>SMART QR ATTENDANCE</h1>

    <button id="logoutBtn">
        Logout
    </button>

</div>

<div class="welcome">

    <h2 id="studentName">
        Welcome
    </h2>

    <p>Student</p>

</div>

<div class="attendance">

    <h2>
        Today's Attendance
    </h2>

    <h3>

        Status :

        <span id="status">

            Not Marked ❌

        </span>

    </h3>

    <button id="scanBtn">

        📷

    </button>

    <h3>

        Scan QR Code

    </h3>

</div>

<div class="note">

<h2>NOTE</h2>

<ul>

<li>
Attendance can be marked only after scanning a valid QR Code.
</li>

<li>
You must be inside the institute campus.
</li>

<li>
GPS verification is mandatory.
</li>

</ul>

</div>

<script src="../js/dashboard.js"></script>

</body>

</html>
